<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amy Yi Mei Li — Architecture Portfolio</title>
  <style>
    /* Global Reset & Typography */
    :root {
      --bg-color: #fcfcfc;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #666666;
      --border-color: #e5e5e5;
      --accent-color: #000000;
      --max-width: 1100px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-top: 80px;
    }

    /* Sticky Navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5%;
      z-index: 1000;
    }

    nav .brand {
      font-weight: 700;
      letter-spacing: 1px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 24px;
    }

    nav ul a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color 0.2s ease;
    }

    nav ul a:hover {
      color: var(--text-main);
    }

    /* Container */
    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Hero / Header Section */
    header.hero {
      padding: 80px 0 60px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .tagline {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    header.hero h1 {
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: -1px;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .bio {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 650px;
    }

    /* Timeline Narrative Sections */
    .timeline {
      padding: 60px 0;
    }

      margin-bottom: 80px;
    }
