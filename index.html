
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amy Yi Mei Li — Architecture Portfolio</title>
  <style>
    :root {
      --bg-color: #fafafa;
      --card-bg: #ffffff;
      --text-main: #111111;
      --text-muted: #666666;
      --border-color: #e5e5e5;
      --accent-color: #000000;
      --award-color: #b48608;
      --max-width: 1100px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-top: 70px;
    }

    /* Sticky Navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5%;
      z-index: 1000;
    }

    nav .brand {
      font-weight: 700;
      letter-spacing: 1px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 24px;
      align-items: center;
    }

    nav ul a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color 0.2s ease;
    }

    nav ul a:hover {
      color: var(--text-main);
    }

    .contact-nav-btn {
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 4px;
      color: var(--text-main) !important;
    }

    .contact-nav-btn:hover {
      background-color: var(--text-main);
      color: #ffffff !important;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Hero / Introduction */
    header.hero {
      padding: 80px 0 60px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .tagline {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    header.hero h1 {
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: -1px;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    header.hero h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    .bio {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 650px;
    }

    /* Timeline Section */
    .timeline {
      padding: 60px 0;
    }

    .year-block {
      margin-bottom: 80px;
    }

    .year-header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
    }

    .year-number {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .year-title {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    /* Project Cards Grid */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
    }

    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.06);
    }

    .project-card.award-card {
      border: 1px solid rgba(180, 134, 8, 0.4);
    }

    .image-placeholder {
      width: 100%;
      height: 220px;
      background-color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .project-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .project-info {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .project-meta {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .award-badge {
      display: inline-block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--award-color);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .project-card h3 {
      font-size: 1.3rem;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .project-card p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      font-size: 0.75rem;
      background: #f0f0f0;
      padding: 4px 10px;
      border-radius: 20px;
      color: #555;
    }

    /* Page Views (Routing) */
    .view-page {
      display: none;
      padding: 40px 0;
    }

    .view-page.active {
      display: block;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 30px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .back-btn:hover {
      color: var(--text-main);
    }

    /* Detailed Project Page Styles */
    .project-header-section {
      margin-bottom: 40px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 30px;
    }

    .project-subtitle {
      font-size: 1.2rem;
      color: var(--text-muted);
      font-style: italic;
      margin-top: -6px;
      margin-bottom: 16px;
    }

    .project-details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      background: #f4f4f4;
      padding: 24px;
      border-radius: 6px;
      margin-bottom: 40px;
    }

    .detail-item h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .detail-item p {
      font-size: 0.95rem;
      font-weight: 500
