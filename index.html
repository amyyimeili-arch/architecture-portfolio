<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amy Yi Mei Li — Architecture Portfolio</title>
  <style>
    :root {
      --bg-color: #fafafa;
      --card-bg: #ffffff;
      --text-main: #111111;
      --text-muted: #666666;
      --border-color: #e5e5e5;
      --accent-color: #000000;
      --award-color: #b48608;
      --max-width: 1100px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-top: 70px;
    }

    /* Sticky Navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5%;
      z-index: 1000;
    }

    nav .brand {
      font-weight: 700;
      letter-spacing: 1px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.95rem;
      cursor: pointer;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 24px;
      align-items: center;
    }

    nav ul a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
    }

    nav ul a:hover {
      color: var(--text-main);
    }

    .contact-nav-btn {
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 4px;
      color: var(--text-main) !important;
    }

    .contact-nav-btn:hover {
      background-color: var(--text-main);
      color: #ffffff !important;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header Section */
    header.hero {
      padding: 60px 0 40px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .tagline {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    header.hero h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: -1px;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    header.hero h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    .bio {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 650px;
    }

    /* Timeline Section */
    .timeline {
      padding: 40px 0;
    }

    .year-block {
      margin-bottom: 60px;
    }

    .year-header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
    }

    .year-number {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .year-title {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    /* Project Grid */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }

    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
    }

    .project-card.award-card {
      border: 1px solid rgba(180, 134, 8, 0.4);
    }

    .image-placeholder {
      width: 100%;
      height: 200px;
      background-color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .project-info {
      padding: 20px;
    }

    .project-meta {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .award-badge {
      display: inline-block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--award-color);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .project-card h3 {
      font-size: 1.25rem;
      margin-bottom: 8px;
      font-weight: 600;
    }

      font-size: 0
